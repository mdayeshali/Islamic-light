<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বই সম্ভার | Islamic Light</title>
  <meta name="theme-color" content="#004d40">

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>
  <div id="header"></div>

  <!-- Hero Section -->
  <section class="shop-hero">
    <div class="hero-content">
      <span class="hero-pill">📖 বিশুদ্ধ ইলমের সন্ধানে</span>
      <h1>ইসলামিক বই সম্ভার</h1>
      <p>নির্ভরযোগ্য প্রকাশনীর বিশুদ্ধ আকীদা ও সিরাতের সেরা গ্রন্থগুলো সরাসরি সংগ্রহ করুন আপনার ঠিকানায়।</p>
    </div>
  </section>

  <!-- Sticky Search Bar -->
  <div class="sticky-search-wrapper">
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="বইয়ের নাম বা লেখকের নাম দিয়ে খুঁজুন..." autocomplete="off">
      <button id="clearSearch" class="clear-btn" style="display: none;">&times;</button>
    </div>
  </div>

  <div class="container">
    <!-- Policy Banner -->
    <div class="policy-banner">
      <div class="policy-item">⚡ 100% সুরক্ষিত UPI পেমেন্ট</div>
      <div class="policy-item">📦 স্পিড পোস্টে সর্বভারতীয় ডেলিভারি</div>
      <div class="policy-item">🔍 বুকিংয়ের পরই ট্র্যাকিং আইডি প্রদান</div>
    </div>

    <!-- Product Grid (Loaded via JavaScript) -->
    <div class="grid" id="productGrid">
      <!-- Skeleton Loaders বা বইয়ের কার্ড স্ক্রিপ্ট দিয়ে লোড হবে -->
    </div>
    
    <div id="noResults" class="no-results" style="display: none;">
      <i class="fa-solid fa-book-open"></i>
      <p>দুঃখিত, আপনার খোঁজা বইটি খুঁজে পাওয়া যায়নি!</p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/js/script.js"></script>
  <script src="/js/shop.js"></script>
</body>
    </html>
