<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইসলামিক কুইজ গেম - Islamic Light</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Global Website CSS -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Quiz Game Specific CSS -->
  <link rel="stylesheet" href="../css/game.css">
</head>
<body>

  <!-- Dynamic Header Container -->
  <div id="header"></div>

  <div class="game-page-container">
    <main class="game-card">

            <!-- গেম টপ বার: ব্যাক বাটন, সাউন্ড বাটন ও কয়েন -->
      <div class="game-top-bar">
        <button type="button" class="icon-btn" id="homeBtn" title="হোমে যান" style="display: none;">
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
          <!-- সাউন্ড মিউট/আনমিউট বাটন -->
          <button type="button" class="icon-btn" id="soundToggleBtn" title="শব্দ চালু/বন্ধ করুন">
            <i class="fa-solid fa-volume-high" id="soundIcon"></i>
          </button>

          <div class="coin-badge">
            <i class="fa-solid fa-coins gold-coin"></i>
            <span id="totalCoinsDisplay">০</span>
          </div>
        </div>
      </div>
      

      <!-- ১. লেভেল সিলেকশন ভিউ (প্রথমে এটি দেখাবে) -->
      <section id="levelSelectView" class="view-screen active">
        <header class="game-header">
          <div class="badge"><i class="fa-solid fa-trophy"></i> দ্বীনি জ্ঞান অর্জন</div>
          <h1>ইসলামিক কুইজ গেম</h1>
          <p>সহজ প্রশ্নের উত্তর দিন, কয়েন জিতুন এবং নতুন লেভেল আনলক করুন!</p>
        </header>

        <div class="level-list" id="levelListContainer">
          <!-- JS থেকে লেভেল কার্ডগুলো লোড হবে -->
          <div class="loading-text">লেভেল লোড হচ্ছে...</div>
        </div>
      </section>

      <!-- ২. কুইজ খেলার ভিউ -->
      <section id="quizPlayView" class="view-screen" style="display: none;">
        <!-- প্রগ্রেস বার ও প্রশ্ন ট্র্যাকার -->
        <div class="quiz-status-header">
          <span class="step-counter" id="questionStepText">প্রশ্ন ১ / ৫</span>
          <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
          </div>
        </div>

        <!-- প্রশ্ন বক্স -->
        <div class="question-container">
          <h2 class="question-title" id="questionText">প্রশ্ন লোড হচ্ছে...</h2>
        </div>

        <!-- অপশন বাটন গ্রুপ -->
        <div class="options-container" id="optionsContainer">
          <!-- JS থেকে ৩টি অপশন তৈরি হবে -->
        </div>

        <!-- শিক্ষণীয় রেফারেন্স ও ব্যাখ্যা কার্ড (উত্তর দেওয়ার পর আসবে) -->
        <div class="explanation-box" id="explanationBox" style="display: none;">
          <div class="explanation-header">
            <i class="fa-solid fa-book-open-reader"></i>
            <span>জেনে রাখুন:</span>
          </div>
          <p id="explanationText">--</p>
        </div>

        <!-- পরবর্তী প্রশ্নের বাটন -->
        <button type="button" class="btn-primary" id="nextQuestionBtn" style="display: none;">
          পরবর্তী প্রশ্ন <i class="fa-solid fa-arrow-right"></i>
        </button>
      </section>

      <!-- ৩. লেভেল সমাপ্তি / ফলাফল ভিউ -->
      <section id="quizResultView" class="view-screen" style="display: none;">
        <div class="result-celebration">
          <div class="result-icon-wrap" id="resultIconWrap">
            <i class="fa-solid fa-award"></i>
          </div>
          <h2 id="resultTitle">অভিনন্দন!</h2>
          <p id="resultSubtitle">আপনি এই লেভেলটি সফলভাবে সম্পন্ন করেছেন।</p>
        </div>

        <!-- রেজাল্ট স্কোরবোর্ড -->
        <div class="result-stats-card">
          <div class="stat-item">
            <span class="label">সঠিক উত্তর</span>
            <strong id="correctScoreText">০ / ৫</strong>
          </div>
          <div class="stat-item">
            <span class="label">অর্জিত কয়েন</span>
            <strong class="text-gold" id="earnedCoinsText">+০</strong>
          </div>
        </div>

        <!-- রেজাল্ট অ্যাকশন বাটনসমূহ -->
        <div class="result-actions">
          <button type="button" class="btn-primary" id="nextLevelBtn">
            পরবর্তী ধাপ খেলুন <i class="fa-solid fa-forward"></i>
          </button>
          <button type="button" class="btn-secondary" id="retryLevelBtn">
            <i class="fa-solid fa-rotate-right"></i> আবার চেষ্টা করুন
          </button>
          <button type="button" class="btn-secondary" id="backToLevelsBtn">
            <i class="fa-solid fa-layer-group"></i> সব লেভেল
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- Dynamic Footer Container -->
  <div id="footer"></div>

  <!-- Global & Game Scripts -->
  <script src="../js/script.js"></script>
  <script src="../js/game.js" defer></script>
</body>
          </html>
