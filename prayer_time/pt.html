<body>

    <!-- Dynamic Header -->
    <div id="header"></div>

    <!-- MAIN CONTENT -->
    <main>
        <!-- HERO SECTION -->
        <section class="hero" aria-label="নামাজের সময়সূচী পরিচিতি">
            <h1>🕌 আজকের নামাজের সময়সূচী</h1>
            <p>আপনার ভৌগোলিক অবস্থান অনুযায়ী নির্ভুল সালাতের ওয়াক্ত ও কাউন্টডাউন</p>
        </section>

        <!-- CONTAINER -->
        <section class="container" aria-label="নামাজের সময় সংক্রান্ত বিবরণ">

            <!-- 1. NEXT PRAYER & COUNTDOWN -->
            <div class="card center next-prayer-card" id="nextPrayerCard">
                <div class="card-badge">বর্তমান স্ট্যাটাস</div>
                <h3>⏳ পরবর্তী নামাজ</h3>
                <div class="prayer-status-box">
                    <p id="currentPrayer" class="status-current">লোড হচ্ছে...</p>
                    <p id="nextPrayer" class="status-next"></p>
                    <div id="countdown" class="status-countdown" aria-live="polite"></div>
                </div>
            </div>

            <!-- 2. LOCATION CONTROLS -->
            <div class="card center location-card">
                <h3>📍 আপনার লোকেশন</h3>
                <p id="locationText" class="location-display">ডিটেক্ট করা হচ্ছে...</p>
            </div>

            <!-- 3. MADHAB SETTINGS -->
            <div class="card center madhab-card">
                <h3>⚖️ আসর নামাজের মাযহাব</h3>
                <div class="custom-select-wrapper">
                    <select id="madhabSelect" onchange="changeMadhab()" aria-label="মাযহাব নির্বাচন করুন">
                        <option value="1">হানাফি (Hanafi)</option>
                        <option value="0">শাফিয়ী / মালিকি / হাম্বলি</option>
                    </select>
                </div>
            </div>

            <!-- 4. FULL PRAYER TIME TABLE -->
            <div class="card full-schedule-card">
                <h3>🕒 সম্পূর্ণ নামাজের ওয়াক্ত</h3>
                <div id="prayerList" class="prayer-times-grid">
                    <p class="loading-state">সময়সূচী লোড হচ্ছে...</p>
                </div>
            </div>

        </section>
